version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: testdb
    ports:
      - "3307:3306"

  app:
    build: .
    ports:
      - "4000:3000"
    environment:
      MYSQLDB_HOST: mysqldb
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
      MYSQLDB_PORT: 3306
      MYSQL_DATABASE: testdb
      NODE_DOCKER_PORT: 3000
    depends_on:
      - mysqldb